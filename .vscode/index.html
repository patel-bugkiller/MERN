<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airship Shooting Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #gameArea {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: black;
    }
    .player {
      width: 60px;
      height: 60px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/3/3a/Airship_icon.png') no-repeat center/contain;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    .bullet {
      width: 6px;
      height: 12px;
      background: yellow;
      position: absolute;
    }
    .enemy {
      width: 40px;
      height: 40px;
      background: red;
      position: absolute;
    }
    .boss {
      width: 80px;
      height: 80px;
      background: purple;
      position: absolute;
      border: 3px solid white;
    }
    .enemyBullet {
      width: 6px;
      height: 12px;
      background: orange;
      position: absolute;
    }
    .powerup {
      width: 30px;
      height: 30px;
      background: lime;
      border-radius: 50%;
      position: absolute;
    }
    #score, #hearts {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
    }
    #hearts {
      top: 40px;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div class="player" id="player"></div>
    <div id="score">Score: 0</div>
    <div id="hearts">❤️❤️❤️</div>
  </div>

  <script>
    const gameArea = document.getElementById("gameArea");
    const player = document.getElementById("player");
    const scoreDisplay = document.getElementById("score");
    const heartsDisplay = document.getElementById("hearts");

    let score = 0;
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let powerups = [];
    let hearts = 3;
    let fireRate = 200; // ms between shots
    let invincible = false;

    // Player movement
    let playerX = window.innerWidth / 2 - 30;
    let moveLeft = false;
    let moveRight = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") moveLeft = true;
      if (e.key === "ArrowRight") moveRight = true;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") moveLeft = false;
      if (e.key === "ArrowRight") moveRight = false;
    });

    function updatePlayer() {
      if (moveLeft && playerX > 0) playerX -= 6;
      if (moveRight && playerX < window.innerWidth - player.clientWidth) playerX += 6;
      player.style.left = playerX + "px";
    }

    // Fire bullet
    function fireBullet() {
      const bullet = document.createElement("div");
      bullet.classList.add("bullet");
      bullet.style.left = playerX + 27 + "px";
      bullet.style.top = player.offsetTop - 10 + "px";
      gameArea.appendChild(bullet);
      bullets.push(bullet);
    }

    // Create enemy
    function createEnemy() {
      const enemy = document.createElement("div");
      enemy.classList.add("enemy");
      enemy.style.left = Math.floor(Math.random() * (window.innerWidth - 40)) + "px";
      enemy.style.top = "0px";
      enemy.health = 3;
      gameArea.appendChild(enemy);
      enemies.push(enemy);
    }

    // Create boss
    function createBoss() {
      const boss = document.createElement("div");
      boss.classList.add("boss");
      boss.style.left = Math.floor(Math.random() * (window.innerWidth - 80)) + "px";
      boss.style.top = "20px";
      boss.health = 10;
      gameArea.appendChild(boss);
      enemies.push(boss);

      // Boss shoots
      const shootInterval = setInterval(() => {
        if (document.body.contains(boss)) {
          const eBullet = document.createElement("div");
          eBullet.classList.add("enemyBullet");
          eBullet.style.left = boss.offsetLeft + boss.clientWidth / 2 + "px";
          eBullet.style.top = boss.offsetTop + boss.clientHeight + "px";
          gameArea.appendChild(eBullet);
          enemyBullets.push(eBullet);
        } else {
          clearInterval(shootInterval);
        }
      }, 500);
    }

    // Create powerup
    function createPowerup() {
      const powerup = document.createElement("div");
      powerup.classList.add("powerup");
      powerup.style.left = Math.floor(Math.random() * (window.innerWidth - 30)) + "px";
      powerup.style.top = "0px";
      gameArea.appendChild(powerup);
      powerups.push(powerup);
    }

    // Game loop
    function gameLoop() {
      updatePlayer();

      // Move bullets
      bullets.forEach((bullet, index) => {
        bullet.style.top = bullet.offsetTop - 8 + "px";
        if (bullet.offsetTop < 0) {
          bullet.remove();
          bullets.splice(index, 1);
        }
      });

      // Move enemy bullets
      enemyBullets.forEach((eBullet, ebIndex) => {
        eBullet.style.top = eBullet.offsetTop + 5 + "px";
        if (eBullet.offsetTop > window.innerHeight) {
          eBullet.remove();
          enemyBullets.splice(ebIndex, 1);
        }

        // Collision with player
        if (
          !invincible &&
          eBullet.offsetTop >= player.offsetTop &&
          eBullet.offsetLeft >= player.offsetLeft &&
          eBullet.offsetLeft <= player.offsetLeft + player.clientWidth
        ) {
          eBullet.remove();
          enemyBullets.splice(ebIndex, 1);
          hearts--;
          heartsDisplay.textContent = "❤️".repeat(hearts);
          if (hearts <= 0) {
            alert("Game Over!");
            window.location.reload();
          }
        }
      });

      // Move enemies
      enemies.forEach((enemy, eIndex) => {
        enemy.style.top = enemy.offsetTop + (enemy.classList.contains("boss") ? 1 : 3) + "px";

        // Collision detection with bullets
        bullets.forEach((bullet, bIndex) => {
          if (
            bullet.offsetTop <= enemy.offsetTop + enemy.clientHeight &&
            bullet.offsetTop >= enemy.offsetTop &&
            bullet.offsetLeft >= enemy.offsetLeft &&
            bullet.offsetLeft <= enemy.offsetLeft + enemy.clientWidth
          ) {
            bullet.remove();
            bullets.splice(bIndex, 1);
            enemy.health -= 1;

            if (enemy.health <= 0) {
              enemy.remove();
              enemies.splice(eIndex, 1);
              score++;
              scoreDisplay.textContent = "Score: " + score;

              // Every 10 kills → spawn boss
              if (score % 10 === 0) {
                createBoss();
              }
            }
          }
        });
      });

      // Move powerups
      powerups.forEach((powerup, pIndex) => {
        powerup.style.top = powerup.offsetTop + 3 + "px";
        if (powerup.offsetTop > window.innerHeight) {
          powerup.remove();
          powerups.splice(pIndex, 1);
        }

        // Collision with player
        if (
          powerup.offsetTop >= player.offsetTop &&
          powerup.offsetLeft >= player.offsetLeft &&
          powerup.offsetLeft <= player.offsetLeft + player.clientWidth
        ) {
          powerup.remove();
          powerups.splice(pIndex, 1);

          // Random boost: faster fire or invincibility
          if (Math.random() > 0.5) {
            fireRate = 100; // faster shooting
            setTimeout(() => fireRate = 200, 5000);
          } else {
            invincible = true;
            player.style.opacity = 0.5;
            setTimeout(() => {
              invincible = false;
              player.style.opacity = 1;
            }, 5000);
          }
        }
      });

      requestAnimationFrame(gameLoop);
    }

    // Auto fire bullets at dynamic rate
    setInterval(() => fireBullet(), fireRate);

    // Spawn normal enemies
    setInterval(createEnemy, 1500);

    // Spawn powerups every 8 seconds
    setInterval(createPowerup, 8000);

    // Start game loop
    gameLoop();
  </script>
</body>
</html>
